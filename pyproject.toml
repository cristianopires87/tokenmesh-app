[tool.poetry]
name = "tokenmesh"
version = "0.1.0"
description = "LLM observability and governance platform"
authors = ["Cristiano Pires"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"
tiktoken = "0.9.0"
sqlalchemy = "^2.0.43"
streamlit = "^1.48.1"
plotly = "^5.0"
httpx = "^0.28.1"
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["sdk", "."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
